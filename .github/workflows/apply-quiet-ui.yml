name: Quiet UI checked integration
on:
  push:
    branches: [codex/quiet-ui-rebuild-20261113]
    paths: [.github/workflows/apply-quiet-ui.yml]
permissions:
  contents: write
concurrency:
  group: quiet-ui-checked-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Jovifei/Token_dishboard_codex'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply exact source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path.cwd()
          changes=[]
          for name in ('.delivery/quiet-ui-0.json','.delivery/quiet-ui-2.json'):
              bundle=json.loads(Path(name).read_text())
              assert bundle['baseline']=='f26dddbf027a64732e8ce98bf1f6ecc8daf3752f'
              for item in bundle['files']:
                  path=root/item['path']
                  assert path.resolve().is_relative_to(root)
                  assert item['path'].startswith(('work/qingxu/','tools/','docs/')) or item['path'] in ('README.md','START-HERE.md')
                  if item['before'] is None:
                      assert not path.exists(),item['path']
                      output=item['content'].encode('utf-8')
                  else:
                      before=path.read_bytes()
                      assert hashlib.sha256(before).hexdigest()==item['before'],item['path']+' baseline mismatch'
                      lines=before.decode('utf-8').splitlines(keepends=True)
                      for start,count,text in reversed(item['edits']):
                          lines[start:start+count]=text.splitlines(keepends=True)
                      output=''.join(lines).encode('utf-8')
                  assert hashlib.sha256(output).hexdigest()==item['after'],item['path']+' result mismatch'
                  changes.append((path,output,item['after']))
          expected={'work/qingxu/ui_quiet.py':'1c67047ddac4064db4070c46858553ea66eb70aa73a3178da7904f20a577c739','work/qingxu/test_ui_quiet.py':'e92f098c56fc9d29357a50199b4e76e3208818e6dcd447b655372ee81c79226a','tools/capture-quiet.py':'bae090e8e15b98a0ac6c69ef81c81ee38cb46ab48b71c203d70b54ac978c4fb7'}
          for name,digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name+' upload mismatch'
          for path,output,digest in changes:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(output)
              expected[str(path.relative_to(root))]=digest
          report=root/'docs/verification/0.12.0-ui-rc1/source-integrity.json'
          report.write_text(json.dumps({'baseline':'f26dddbf027a64732e8ce98bf1f6ecc8daf3752f','files':expected},indent=2)+'\n')
          print('Verified',len(expected),'source and documentation files')
          PY
      - name: Install isolated GUI test environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk python3-venv xvfb fonts-noto-cjk
          python3 -m venv --system-site-packages .quiet-venv
          .quiet-venv/bin/pip install -r tools/requirements-runtime.txt Pillow
      - name: Compile and test actual implementation
        shell: bash
        run: |
          set -o pipefail
          .quiet-venv/bin/python -m compileall -q work/qingxu tools
          xvfb-run -a -s '-screen 0 1600x1100x24' .quiet-venv/bin/python tools/run-windows-tests.py --result docs/verification/0.12.0-ui-rc1/github-tests.json 2>&1 | tee docs/verification/0.12.0-ui-rc1/github-test-log.txt
      - name: Capture real Tk screens using synthetic data
        run: xvfb-run -a -s '-screen 0 1600x1100x24' .quiet-venv/bin/python tools/capture-quiet.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiet-ui-integration-evidence
          path: |
            docs/verification/0.12.0-ui-rc1/
            docs/design/quiet/
          if-no-files-found: warn
      - name: Commit verified implementation to this branch only
        shell: bash
        env:
          BRANCH: codex/quiet-ui-rebuild-20261113
        run: |
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md START-HERE.md docs/ENGINEERING-HANDOFF.md tools/run-windows-tests.py work/qingxu/DESIGN-BRIEF.md work/qingxu/app.py work/qingxu/test_workbench_gui.py work/qingxu/ui_billing.py work/qingxu/ui_handoff.py work/qingxu/ui_monitor.py work/qingxu/ui_motion.py work/qingxu/ui_preferences.py work/qingxu/workbench.py docs/design/quiet docs/verification/0.12.0-ui-rc1
          git rm .delivery/quiet-ui-0.json .delivery/quiet-ui-2.json
          git commit -m 'feat(ui): integrate verified Quiet desktop redesign and real Tk evidence'
          git push origin HEAD:refs/heads/$BRANCH
