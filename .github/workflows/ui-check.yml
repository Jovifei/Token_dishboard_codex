name: Qingxu Apple UI checks

on:
  pull_request:
    paths:
      - "work/qingxu/**"
      - "tools/**"
      - ".github/workflows/ui-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-review:
    name: Exact source review bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Archive tracked application source only
        run: |
          mkdir review-source
          git archive --format=tar HEAD work/qingxu tools docs README.md START-HERE.md AGENTS.md LICENSE Build-Windows.cmd Preview-Demo.cmd Start-Qingxu.cmd Test-Windows.cmd TAKEOVER-PROMPT.txt .github .gitignore .gitattributes | tar -xf - -C review-source
          git rev-parse HEAD > review-source/SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qingxu-ui-review-source
          path: review-source/
          include-hidden-files: true
          retention-days: 14

  tk-gui-tests:
    name: Linux Xvfb Tk regression
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install native Tk and virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk xvfb
      - name: Compile all maintained Python
        run: python3 -m compileall -q work/qingxu tools
      - name: Run existing and Apple UI suites
        run: xvfb-run -a python3 tools/run-windows-tests.py --result ui-check-result.json
      - name: Upload synthetic test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qingxu-ui-test-receipt
          path: ui-check-result.json
          if-no-files-found: ignore

  icon-stdlib:
    name: Stdlib-only icon build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm GUI imports and icon generator
        shell: pwsh
        run: |
          py -3 -c "import sys;sys.path.insert(0, 'work/qingxu');from ui_brand import write_ico;from pathlib import Path;path=write_ico(Path('qingxu-ci.ico'));assert path.stat().st_size > 1000;print(path)"
